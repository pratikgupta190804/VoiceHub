<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/avatar.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceUp</title>

  <!-- Google Fonts - Professional Font Combination -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Chatbot Configuration -->
  <script>
    window.chtlConfig = { chatbotId: "6231621865" }
  </script>
  <script async data-id="6231621865" id="chtl-script" type="text/javascript"
    src="https://chatling.ai/js/embed.js"></script> <!-- Google Translate - NO API KEY NEEDED -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      console.log('Google Translate initializing...');
      try {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr,gu,ta,te,bn,ur,pa,ml,kn,or,as,es,fr,ar,zh',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
        console.log('Google Translate initialized successfully');

        // Force hide banner after initialization
        setTimeout(() => {
          hideBannerElements();
        }, 1000);

      } catch (error) {
        console.error('Google Translate initialization failed:', error);
      }
    }

    // Function to continuously hide banner elements
    function hideBannerElements() {
      const elementsToHide = [
        '.goog-te-banner-frame',
        '.skiptranslate',
        '.goog-te-gadget',
        '.goog-te-balloon-frame',
        '.goog-te-ftab',
        'iframe[name="goog-te-banner-frame"]'
      ];

      elementsToHide.forEach(selector => {
        const elements = document.querySelectorAll(selector);
        elements.forEach(element => {
          element.style.display = 'none !important';
          element.remove();
        });
      });

      // Reset body positioning
      document.body.style.top = '0px';
      document.body.style.position = 'static';

      console.log('Banner elements hidden');
    }

    // Make function globally accessible
    window.hideBannerElements = hideBannerElements;

    // Run hide function periodically to catch any new banners
    setInterval(hideBannerElements, 2000);
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* Completely Hide Google Translate branding and banner */
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }

    .goog-te-banner-frame {
      display: none !important;
    }

    .goog-te-gadget {
      display: none !important;
    }

    .goog-te-balloon-frame {
      display: none !important;
    }

    .goog-te-ftab {
      display: none !important;
    }

    .goog-te-menu-frame {
      display: none !important;
    }

    body {
      top: 0px !important;
      position: static !important;
    }

    /* Hide the top frame completely */
    body>.skiptranslate {
      display: none !important;
    }

    .skiptranslate {
      display: none !important;
    }

    /* Ensure body positioning is normal */
    html {
      position: static !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element" style="display: none;"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
